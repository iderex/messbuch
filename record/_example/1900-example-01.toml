# Layout example for docs/decisions/0003-storage-format.md.
#
# This file is NOT a corpus record and its numbers are NOT transcribed from any
# publication. They are invented to show the shape of a file and nothing else.
# It sits under record/_example/ because a quantity directory whose name begins
# with an underscore is excluded from the build and is not read as a vocabulary
# entry, which is the rule stated in 0003. Do not cite anything in this file.
#
# What this example fixes is the layout: the directory is the quantity
# identifier, the filename is <year>-<first-author-slug>-<nn>.toml, and the
# serialisation is TOML. The field set below is illustrative only. Which fields
# a record must carry, what they are called and which are required is the
# measurement record schema, which is decided in its own record and is not
# decided here. Expect these names to change when it lands.

[source]
year = 1900
first_author = "Example"
# The comment next to a value is one of the reasons TOML was chosen over JSON.
# A transcriber writes here what the source actually said, which is what lets a
# later reader check the transcription without fetching the paper.
locator = "illustrative, no source exists"

[measurement]
quantity = "_example"
value = 1.0
unit = "1"

[measurement.uncertainty]
# Uncertainty has its own decision record. This block shows only that the
# representation is structured rather than a single number, and it is not the
# representation that record fixes.
statistical = 0.1
systematic = 0.2
