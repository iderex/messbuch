# The offline boundary (#65). docs/decisions/0009-offline-by-default.md rests
# the whole offline guarantee on a check over the import graph, fixes the name
# this job reports under so a branch protection can match it, and says the check
# itself was owed. This is that check.
#
# It runs one leg of the local gate rather than the whole gate. A job reporting
# under a name that claims one property, and failing when a formatter or a
# transcription is red, teaches a reader that the name means nothing in
# particular. `go run . ci no-network-imports` refuses an id the gate does not
# declare, so renaming the leg reds this job instead of quietly running nothing.
#
# What the leg refuses, what it cannot see, and the list of network-capable
# paths it reads all live in internal/gate/netimports.go. They are not restated
# here: the leg prints its own limits beside its result, and a copy in this file
# would drift against the code that decides it.
name: No network outside the net package

on:
  # No branch filter, no path filter, no base filter. A check that reports on
  # only some pull requests leaves the branch looking guarded when it is not,
  # which docs/required-checks.md argues is worse than no check at all. A path
  # filter would be the same defect in a quieter form here, since the property
  # is about the import graph of the whole tree rather than about the files a
  # pull request happens to touch.
  pull_request:

# Read-only. The job reads the checked-out tree and writes nothing anywhere.
permissions:
  contents: read

concurrency:
  group: no-network-imports-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  no-network-imports:
    # The literal check-run name a branch protection matches, fixed by
    # docs/decisions/0009-offline-by-default.md rather than by this file.
    # Renaming it empties a required set without reporting anything.
    name: No network outside the net package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not leave the token in .git/config.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The pin in go.mod and nothing else. A version written here would be
          # a second pin, and the two would disagree on the day one moves.
          go-version-file: go.mod

      # The proof before the check, on every invocation. The leg is asserted
      # against a fixture tree carrying a network-capable import outside the
      # permitted package, and against the same tree with that import moved
      # inside it. A guard nobody has seen fail is a guard nobody knows works,
      # and this one is what stands behind the name in the job above.
      #
      # Only this leg's proofs, and only the ones that read a fixture. Running
      # the whole package red this job for a formatting defect on the branch
      # that landed the formatter check, which is exactly the confusion a check
      # reporting under one property's name must not create. The test that
      # reads this repository's own tree is outside the filter as well, because
      # judging the tree is the step below and its refusal is the more useful
      # message.
      #
      # The filter is a prefix every fixture proof of this leg carries, and the
      # floor below is what stops a filter that has stopped matching from
      # passing silently: a `-run` matching nothing exits zero, which is the one
      # failure mode a name filter introduces.
      - name: Prove the leg refuses what it names, and accepts the near miss
        run: |
          set -euo pipefail
          out=$(go test ./internal/gate -run '^TestNetImports' -count=1 -v)
          printf '%s\n' "$out"
          ran=$(printf '%s\n' "$out" | grep -c '^--- PASS' || true)
          if [ "$ran" -lt 8 ]; then
            echo "::error::Expected at least 8 proofs of this leg and ${ran} ran. Either the name filter in this workflow has stopped matching, or a proof was deleted."
            exit 1
          fi
          echo "${ran} proof(s) of this leg ran."

      - name: Refuse a network-capable import outside the net package
        run: go run . ci no-network-imports
